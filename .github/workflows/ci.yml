name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Required check in the "main" ruleset on GitHub — rename it there too
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm format:check
      - run: pnpm -F mobile exec expo install --check
      # Generates the gitignored expo-env.d.ts and typed routes for tsc: https://docs.expo.dev/router/reference/typed-routes/#type-generation
      - run: pnpm -F mobile exec expo customize tsconfig.json
      - run: pnpm exec turbo run lint typecheck test build
